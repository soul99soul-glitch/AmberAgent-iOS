name: AmberPhoneRunner
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_OBJC_ARC: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  IPhoneUseRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amber.selfcontrol.runner
        PRODUCT_NAME: iPhoneUse
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/IPhoneUseRunnerUITests-Bridging-Header.h
schemes:
  AmberPhoneRunner:
    build:
      targets:
        IPhoneUseRunnerUITests: [test]
    test:
      config: Debug
      targets:
        - name: IPhoneUseRunnerUITests
          parallelizable: false
