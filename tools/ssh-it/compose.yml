name: amber-ios-ssh-it
services:
  jump:
    build: .
    ports: ["127.0.0.1:2222:22"]
    volumes:
      - ./fixtures/authorized_keys:/etc/ssh/authorized_keys:ro
      - ./sshd_jump.conf:/etc/ssh/sshd_config:ro
    networks: [edge, inner]
  target:
    build: .
    volumes:
      - ./fixtures/authorized_keys:/etc/ssh/authorized_keys:ro
      - ./sshd_target.conf:/etc/ssh/sshd_config:ro
    networks: [inner]
networks:
  edge: {}
  inner: {internal: true}
