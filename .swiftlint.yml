# Swift 文件以 1500 物理行为硬上限，含空行和注释。
# CI 通过 scripts/check_swift_file_lengths.py 无基线严格检查全部 Git 可见 Swift。
disabled_rules:
  - todo

opt_in_rules:
  - force_cast
  - force_try

line_length:
  warning: 300
  error: 400
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 1200
  error: 1500

type_body_length:
  warning: 1200
  error: 2000

function_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 60
  error: 100

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 60
    error: 80
  allowed_symbols:
    - _
  validates_start_with_lowercase: off

type_name:
  max_length:
    warning: 60
    error: 80

excluded:
  - build
  - iosApp/build
  - .build
  - iosApp/IshRuntimeResources
