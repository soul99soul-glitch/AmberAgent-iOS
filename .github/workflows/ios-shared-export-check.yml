name: iOS Shared Export Check

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'native/**'
      - 'iosApp/**'
      - 'scripts/check_shared_export_reachability.py'
      - '.github/workflows/ios-shared-export-check.yml'

permissions:
  contents: read

jobs:
  shared-export-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-ios-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Shared framework
        run: |
          chmod +x gradlew
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Verify Shared export reachability
        run: python3 scripts/check_shared_export_reachability.py

      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec iosApp/project.yml

      - name: Build arm64 Simulator app
        run: |
          xcodebuild -quiet \
            -project iosApp/AmberAgent.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
