<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amber 首页 Redesign v3 · Things 3 基准</title>
<style>
  :root { --sans: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; }
  .light {
    --bg: #FFFFFF; --label: #1D1D1F; --label-2: #8A8A8E; --label-3: #C4C4C7;
    --sel: #EEF0F3; --shadow: 0 6px 18px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.12);
  }
  .dark {
    --bg: #1B1C1F; --label: #EDEDEF; --label-2: #8C8D93; --label-3: #4A4B50;
    --sel: #26282C; --shadow: 0 6px 18px rgba(0,0,0,.5);
  }
  .light, .dark {
    --amber: #F0932B; --blue: #2C8CF4; --teal: #2FB3A6; --red: #F2475F; --sand: #B9A37E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #D9D9DC; font-family: var(--sans); -webkit-font-smoothing: antialiased;
    min-height: 100vh; padding: 36px 24px 56px; display: flex; justify-content: center; gap: 40px; flex-wrap: wrap;
  }
  .cap { text-align: center; font: 500 12px var(--sans); color: #6b6b70; margin-top: 14px; }

  .phone {
    width: 393px; height: 852px; border-radius: 54px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--label);
    box-shadow: 0 0 0 11px #111, 0 0 0 12px #333, 0 40px 80px rgba(0,0,0,.22);
  }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 9; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 6px 34px 0 46px; font: 600 16px var(--sans); z-index: 8; }
  .status .r { display: flex; gap: 6px; align-items: center; }
  .scroll { position: absolute; inset: 0; overflow-y: auto; padding: 62px 0 120px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  .top { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; margin-bottom: 14px; color: var(--label); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(from 200deg, #2c4c7c, #d9772f, #c8433b, #3b6a8f, #e0b25a, #2c4c7c); }

  .row { height: 44px; display: flex; align-items: center; padding: 0 20px; gap: 14px; }
  .row .ic { width: 22px; height: 22px; display: grid; place-items: center; flex: none; }
  .row .t { flex: 1; min-width: 0; font: 400 17px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .n { font: 400 15px var(--sans); color: var(--label-2); font-variant-numeric: tabular-nums; flex: none; }
  .row.sel { background: var(--sel); border-radius: 10px; margin: 0 8px; padding: 0 12px; }
  .row.more .t { color: var(--label-2); font-size: 15px; }
  .gap { height: 26px; }

  .area { height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 20px; margin-top: 8px; }
  .area .t { font: 700 17px var(--sans); }
  .area .ic { width: 22px; display: grid; place-items: center; color: var(--label-2); }

  .spin { animation: spin 1.1s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 22px 0; z-index: 6;
    background: linear-gradient(to bottom, transparent, var(--bg) 30%); }
  .bottom .tb { display: flex; align-items: center; gap: 7px; font: 400 16px var(--sans); color: var(--label-2); height: 32px; }
  .fab { position: absolute; right: 22px; bottom: 96px; width: 56px; height: 56px; border-radius: 50%; background: var(--amber); display: grid; place-items: center; color: #fff; box-shadow: var(--shadow); z-index: 7; }
  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--label); z-index: 9; }
</style>
</head>
<body>
<template id="screen">
<div class="phone">

  <div class="status">

    <span class="r">

      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.4 10.4 0 0 0 8 .6 10.4 10.4 0 0 0 .9 3.4L2 4.6a8.8 8.8 0 0 1 6-2.4Zm0 3.3c1.4 0 2.7.5 3.7 1.4l1.1-1.2A7.1 7.1 0 0 0 8 3.9a7.1 7.1 0 0 0-4.8 1.8l1.1 1.2c1-.9 2.3-1.4 3.7-1.4Zm0 3.3c-.6 0-1.1.2-1.5.6L8 11l1.5-1.6c-.4-.4-.9-.6-1.5-.6Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="13" height="9" rx="2" fill="currentColor"/><rect x="25" y="4.5" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".4"/></svg>

  <div class="scroll">

      <span class="t">春江花月夜哲思</span><span class="n">生成中</span>
    </div>

    <div class="gap"></div>

    <!-- 工具：像 Today / Upcoming / Anytime / Someday -->
    <div class="row">
      <span class="ic"><svg width="21" height="21" viewBox="0 0 20 20" fill="var(--blue)"><path d="M2 4.2c2.6-.8 5.3-.5 7.3 1v11.2c-2-1.4-4.7-1.7-7.3-.9zM18 4.2c-2.6-.8-5.3-.5-7.3 1v11.2c2-1.4 4.7-1.7 7.3-.9z"/></svg></span>
      <span class="t">深度阅读</span><span class="n">3</span>
    </div>
    <div class="row">
      <span class="ic"><svg width="21" height="21" viewBox="0 0 20 20" fill="var(--teal)"><circle cx="6.5" cy="6.5" r="3"/><circle cx="13.5" cy="6.5" r="3"/><path d="M1 16.5c.4-3 2.6-5 5.5-5s5.1 2 5.5 5zM13.5 11.5c2.9 0 5.1 2 5.5 5h-5.3c-.2-1.9-1-3.5-2.2-4.6.6-.3 1.3-.4 2-.4z"/></svg></span>
      <span class="t">模型议会</span><span class="n"></span>
    </div>
    <div class="row">
      <span class="ic"><svg width="20" height="20" viewBox="0 0 20 20" fill="var(--red)"><rect x="2" y="2" width="7" height="7" rx="2"/><rect x="11" y="2" width="7" height="7" rx="2"/><rect x="2" y="11" width="7" height="7" rx="2"/><rect x="11" y="11" width="7" height="7" rx="2"/></svg></span>
      <span class="t">小应用</span><span class="n">12</span>
    </div>
    <div class="row">
      <span class="ic"><svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="var(--sand)" stroke-width="1.9"><circle cx="10" cy="10" r="8"/><path d="M2 10h16M10 2c2.6 2.4 2.6 13.6 0 16M10 2c-2.6 2.4-2.6 13.6 0 16"/></svg></span>
      <span class="t">站点</span><span class="n">5</span>
    </div>

    <div class="gap"></div>

    <!-- 会话：像 Things 的 Area -->
    <div class="area">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M4 3h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 3.5V14H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg></span>
      <span class="t">会话</span>
    </div>
    <div class="row sel">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--label-2)" stroke-width="1.7"><path d="M4 3.5h12a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 0 1 2.5 12V5A1.5 1.5 0 0 1 4 3.5z"/></svg></span>
      <span class="t">北宋白月光</span><span class="n">今天</span>
    </div>
    <div class="row">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--label-2)" stroke-width="1.7"><path d="M4 3.5h12a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 0 1 2.5 12V5A1.5 1.5 0 0 1 4 3.5z"/></svg></span>
      <span class="t">宋仁宗天圣四年</span><span class="n">周二</span>
    </div>
    <div class="row">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--label-2)" stroke-width="1.7"><path d="M4 3.5h12a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 0 1 2.5 12V5A1.5 1.5 0 0 1 4 3.5z"/></svg></span>
      <span class="t">宋太祖谥号</span><span class="n">周二</span>
    </div>
    <div class="row">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--label-2)" stroke-width="1.7"><path d="M4 3.5h12a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 0 1 2.5 12V5A1.5 1.5 0 0 1 4 3.5z"/></svg></span>
      <span class="t">用 SVG 画一个鹈鹕骑自行车</span><span class="n">周一</span>
    </div>
    <div class="row">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--label-2)" stroke-width="1.7"><path d="M4 3.5h12a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 0 1 2.5 12V5A1.5 1.5 0 0 1 4 3.5z"/></svg></span>
      <span class="t">mac 与 Synara 连接</span><span class="n">9月20日</span>
    </div>
    <div class="row">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--label-2)" stroke-width="1.7"><path d="M4 3.5h12a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 0 1 2.5 12V5A1.5 1.5 0 0 1 4 3.5z"/></svg></span>
      <span class="t">Jev 网页循环负加速</span><span class="n">9月20日</span>
    </div>
    <div class="row">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--label-2)" stroke-width="1.7"><path d="M4 3.5h12a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 0 1 2.5 12V5A1.5 1.5 0 0 1 4 3.5z"/></svg></span>
      <span class="t">Jev 启用状态</span><span class="n">9月19日</span>
    </div>
    <div class="row more">
      <span class="ic"></span><span class="t">更早的 42 个会话</span>
    </div>
  </div>

  <div class="fab"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M11 4v14M4 11h14"/></svg></div>
  <div class="bottom">
    <span class="tb"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="m12.2 12.2 3.8 3.8"/></svg>搜索</span>
    <span class="tb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10.3 2.8h3.4l.5 2.6 1.9 1.1 2.5-.9 1.7 2.9-2 1.7v2.2l2 1.7-1.7 2.9-2.5-.9-1.9 1.1-.5 2.6h-3.4l-.5-2.6-1.9-1.1-2.5.9-1.7-2.9 2-1.7v-2.2l-2-1.7 1.7-2.9 2.5.9 1.9-1.1z"/><circle cx="12" cy="12" r="3"/></svg></span>
  </div>
  <div class="home-ind"></div>
</div>
</template>

<script>
  const GLYPHS = {
    A: ["01110","10001","10001","11111","10001","10001","10001"],
    M: ["10001","11011","10101","10101","10001","10001","10001"],
    B: ["11110","10001","10001","11110","10001","10001","11110"],
    E: ["11111","10000","10000","11110","10000","10000","11111"],
    R: ["11110","10001","10001","11110","10100","10010","10001"],
  };
  function drawWordmark(svg) {
    const cell = 2.8, dot = 2.2, gap = 1, word = "AMBER", ns = "http://www.w3.org/2000/svg";
    const w = word.length * 5 + (word.length - 1) * gap;
    svg.setAttribute("width", w * cell); svg.setAttribute("height", 7 * cell);
    svg.setAttribute("viewBox", `0 0 ${w * cell} ${7 * cell}`);
    [...word].forEach((ch, i) => GLYPHS[ch].forEach((row, y) => [...row].forEach((b, x) => {
      if (b !== "1") return;
      const r = document.createElementNS(ns, "rect");
      r.setAttribute("x", (i * (5 + gap) + x) * cell); r.setAttribute("y", y * cell);
      r.setAttribute("width", dot); r.setAttribute("height", dot); r.setAttribute("rx", .3);
      r.setAttribute("fill", "currentColor"); svg.appendChild(r);
    })));
  }
  const tpl = document.getElementById("screen");
  [["light", "Light"], ["dark", "Dark"]].forEach(([theme, label]) => {
    const wrap = document.createElement("div"), node = tpl.content.cloneNode(true);
    node.querySelector(".phone").classList.add(theme);
    drawWordmark(node.querySelector("[data-wordmark]"));
    wrap.appendChild(node);
    const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = label;
    wrap.appendChild(cap); document.body.appendChild(wrap);
  });
</script>
</body>
</html>
